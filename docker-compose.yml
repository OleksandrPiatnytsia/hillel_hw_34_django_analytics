# Local Docker setup of the Analytics service:
#   nginx (http://localhost:8010) in front of Django (web)
#   + PostgreSQL (db) + Redis (redis)
#   + Celery worker (celery) and scheduler (celery-beat)
#
#   docker compose up -d --build   build the image and start everything
#   docker compose ps              state and health of the services
#   docker compose logs -f web     follow the Django / gunicorn output
#   docker compose logs -f celery celery-beat   background tasks and the schedule
#   docker compose down            stop and remove the containers (volumes stay)
#
# Analytics runs on its own: its own database and Redis, other host ports
# than the bookstore (8000 / 5432 / 6379 there), so both can run together.
# The connection to the bookstore's RabbitMQ (an external network) is added
# at stage 2, together with the consumer of the events.
#
# Variables like ${POSTGRES_DB} are taken from the .env file next to this file.

# The part shared by web, celery and celery-beat: one image, the same
# settings. "&django" names it, "<<: *django" copies its keys into a service.
x-django: &django
  build: .
  # One name for the three services: built once, the others reuse it
  image: hillel-analytics-django
  # All variables from .env go into the container; the file itself is not
  # in the image (.dockerignore)
  env_file: .env
  environment:
    # "environment" wins over "env_file": in .env the hosts are "localhost"
    # with the Mac ports (for runserver); inside the Docker network the
    # services are reached by name, on their own ports
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379
    CELERY_BROKER_URL: ""
    # http://localhost:8010 has no certificate: no HTTPS redirect and no
    # secure-only cookies (otherwise no login is possible). Railway: True.
    DJANGO_HTTPS: "False"
    SENTRY_ENVIRONMENT: docker

services:
  db:
    # The same major version as the bookstore. Fixed: version 18 can't open
    # the data files of 17 without an upgrade.
    image: postgres:17-alpine
    environment:
      # Used only on the FIRST start (empty volume): the image creates this
      # database and user
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Ukrainian sorting rules (ICU): book titles sort as people expect
      # (А, Б, ... Ґ, ... І), not by Unicode code points. First start only.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=uk-UA"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5433 on the Mac: 5432 belongs to the bookstore's database.
      # runserver and pytest connect to localhost:5433 (.env POSTGRES_PORT).
      - "5433:5432"
    healthcheck:
      # $$ = a literal $: the variables are read inside the container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    # The cache, sessions (database 0) and the Celery queue (database 1) of
    # Analytics. Its own server: a FLUSHALL in one project never empties the
    # other one. No volume: the cache may be lost; sessions are in
    # PostgreSQL too (cached_db), and the queue is refilled by beat.
    image: redis:8-alpine
    ports:
      # 6380 on the Mac: 6379 belongs to the bookstore's Redis
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    <<: *django
    # No published port: reached only through nginx
    expose:
      - "8000"
    volumes:
      # collectstatic output (docker-entrypoint.sh), served by nginx
      - static_data:/app/staticfiles
    healthcheck:
      # GET /health/ (PostgreSQL + Redis). The slim image has no curl, so
      # Python does the request: an error or 503 -> exit code 1 -> unhealthy
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      # migrate + collectstatic + gunicorn start take a few seconds
      start_period: 30s
    depends_on:
      # Healthy, not just started: migrate needs a database that accepts
      # connections
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.30-alpine
    ports:
      # http://localhost:8010 on the Mac (8000 is the bookstore's nginx)
      - "8010:80"
    volumes:
      # :ro = read-only: nginx only reads these files
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    healthcheck:
      # The whole chain: nginx -> web -> PostgreSQL + Redis.
      # 127.0.0.1, not localhost: nginx listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      # web healthy = collectstatic is done: the files are in the volume
      web:
        condition: service_healthy

  celery:
    # The worker: runs the tasks from the queue (Redis database 1)
    <<: *django
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      # "Are you alive?" to this worker over the broker; it answers "pong"
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    depends_on:
      # web healthy = migrations are applied: a task never meets a database
      # without the new tables
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    # The scheduler: puts the tasks of CELERY_BEAT_SCHEDULE into the queue
    # at their time. Exactly ONE beat: two would queue every task twice.
    <<: *django
    # /app belongs to root, the "app" user can write only to /tmp
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # A fixed name: without it compose adds the folder name as a prefix.
  # Not shared with the bookstore: Analytics keeps its own data.
  postgres_data:
    name: hillel_analytics_postgres_data
  static_data:
